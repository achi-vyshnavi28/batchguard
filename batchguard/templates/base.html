<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BatchGuard{% block title %}{% endblock %}</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1c2330;--muted:#5d6878;--line:#dfe3ea;--ok:#1a7f4b;--bad:#b42318;--warn:#b54708;--accent:#2f5bd3}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;background:#101828;color:#fff}
header a{color:#cfd7ea;text-decoration:none}header .who{margin-left:auto;color:#cfd7ea;font-size:14px}
main{max-width:1150px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.pass,.released,.closed{color:var(--ok);border-color:var(--ok)}.fail,.open,.rejected{color:var(--bad);border-color:var(--bad)}
.in_progress,.in_review{color:var(--warn);border-color:var(--warn)}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:14px}.flash.error{background:#fef3f2;color:var(--bad);border:1px solid #fecdca}
.flash.ok{background:#ecfdf3;color:var(--ok);border:1px solid #abefc6}
input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
form.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.muted{color:var(--muted);font-size:13px}.oos{color:var(--bad);font-weight:600}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
</style></head><body>
<header><strong>BatchGuard</strong><a href="/">Batches</a><a href="/audit">Audit trail</a>
{% if user %}<span class="who">{{ user.full_name }} · {{ user.role }} · <a href="/logout">Log out</a></span>{% endif %}</header>
<main>{% if flash %}<div class="flash {{ flash.kind }}" role="alert">{{ flash.message }}</div>{% endif %}{% block body %}{% endblock %}</main>
</body></html>

{% extends "base.html" %}{% block title %} · Log in{% endblock %}{% block body %}
<div class="card" style="max-width:380px;margin:40px auto">
<h2>Log in</h2>
<form method="post" action="/login">
<p><label>Username<br><input name="username" autocomplete="username" required></label></p>
<p><label>Password<br><input name="password" type="password" autocomplete="current-password" required></label></p>
<button type="submit">Log in</button></form>
<p class="muted">Demo users: op1 / op2 (operator), sup1 (supervisor), qa1 (QA). Passwords are in the README.
Accounts lock after 3 failed attempts; sessions end after 15 minutes idle.</p></div>
{% endblock %}

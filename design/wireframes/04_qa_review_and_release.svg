<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>04 QA review and release</title><rect width="1280" height="800" fill="#ffffff"/><rect width="1280" height="56" fill="#101828"/><text x="24" y="35" fill="#fff" font-size="18" font-weight="700" font-family="Inter, Arial">BatchGuard</text><text x="150" y="35" fill="#cfd7ea" font-size="15" font-family="Inter, Arial">Batches</text><text x="240" y="35" fill="#cfd7ea" font-size="15" font-family="Inter, Arial">Audit trail</text><text x="350" y="35" fill="#cfd7ea" font-size="15" font-family="Inter, Arial">Cleaning log</text><text x="1256" y="35" fill="#cfd7ea" font-size="14" text-anchor="end" font-family="Inter, Arial">Kiran QA · qa · Log out</text><text x="40" y="105" fill="#1c2330" font-size="26" font-weight="700" text-anchor="start" font-family="Inter, Arial">B-2026-014</text><rect x="210" y="86" width="77" height="22" rx="11" fill="#fff" stroke="#b54708"/><text x="248.5" y="101" fill="#b54708" font-size="12" font-weight="600" text-anchor="middle" font-family="Inter, Arial">in review</text><rect x="40" y="140" width="760" height="250" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="60" y="175" fill="#1c2330" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, Arial">Release checklist</text><text x="60" y="215" fill="#1a7f4b" font-size="15" font-weight="400" text-anchor="start" font-family="Inter, Arial">✔  All 5 steps recorded</text><text x="60" y="247" fill="#1a7f4b" font-size="15" font-weight="400" text-anchor="start" font-family="Inter, Arial">✔  3/3 critical steps verified</text><text x="60" y="279" fill="#1a7f4b" font-size="15" font-weight="400" text-anchor="start" font-family="Inter, Arial">✔  Deviation #1 closed (QA, signed)</text><text x="60" y="311" fill="#1a7f4b" font-size="15" font-weight="400" text-anchor="start" font-family="Inter, Arial">✔  Audit trail intact</text><text x="60" y="343" fill="#1a7f4b" font-size="15" font-weight="400" text-anchor="start" font-family="Inter, Arial">✔  ALCOA+ 9/9 pass</text><text x="60" y="434" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Password to sign</text><rect x="60" y="440" width="300" height="36" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="70" y="463" fill="#98a2b3" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">••••••••</text><rect x="380" y="440" width="120" height="36" rx="6" fill="#2f5bd3" stroke="#2f5bd3"/><text x="440.0" y="463" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="Inter, Arial">Release batch</text><rect x="540" y="440" width="168" height="36" rx="6" fill="#fff" stroke="#2f5bd3"/><text x="624.0" y="463" fill="#2f5bd3" font-size="14" font-weight="600" text-anchor="middle" font-family="Inter, Arial">Reject batch (v1.1)</text><rect x="840" y="140" width="300" height="86" rx="6" fill="#fffbe6" stroke="#f5c542"/><text x="852" y="162" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Reviewer and releaser must be</text><text x="852" y="182" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">different people (two-person rule).</text><text x="852" y="202" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Reject needs reason + signature.</text></svg>